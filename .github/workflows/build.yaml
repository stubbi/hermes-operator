name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      # Same namespace variable and default as release.yaml (#173).
      IMAGE: ghcr.io/${{ vars.IMAGE_NAMESPACE || 'stubbi' }}/hermes-operator
      # The main-branch :dev push needs credentials for that namespace: either
      # it is owned by the repository owner (GITHUB_TOKEN suffices), or
      # GHCR_PUSH_TOKEN is set. Without either, build without pushing instead
      # of failing the required check on main.
      CAN_PUSH: ${{ github.event_name == 'push' && (secrets.GHCR_PUSH_TOKEN != '' || (vars.IMAGE_NAMESPACE || 'stubbi') == github.repository_owner) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Multi-arch builds for releases happen in release.yaml via
      # docker/build-push-action (uses Go cross-compile under
      # BUILDPLATFORM, not QEMU). This job is a fast PR smoke test:
      # single-platform, host-arch.
      - uses: docker/login-action@v4
        if: env.CAN_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_PUSH_USER || github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.CAN_PUSH == 'true' }}
          tags: ${{ env.IMAGE }}:dev,${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
