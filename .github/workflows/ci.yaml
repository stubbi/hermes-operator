name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned one minor behind the rest of CI on purpose. golangci-lint
      # v2.12.2 is built against Go 1.26 and cannot typecheck the 1.27
      # standard library: it fails on math/rand/v2 with "method must have no
      # type parameters". Linting under 1.26 still type-checks our code
      # correctly, since go.mod declares go 1.26.0 as the language version.
      # Keep this minimum-version coverage while testing the shipped compiler below.
      - uses: actions/setup-go@v7
        with: { go-version: "1.26" }
      - uses: golangci/golangci-lint-action@v9
        with: { version: v2.12.2 }

  govulncheck:
    name: govulncheck (${{ matrix.go }}, ${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27.4"]
        arch: [amd64, arm64]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # Install for the runner host before selecting the shipped target.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check the Linux operator entrypoint
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: '"$(go env GOPATH)/bin/govulncheck" ./cmd/...'

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        k8s: ["1.28", "1.29", "1.30", "1.31", "1.32"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.4" }
      - name: Test envtest setup gate
        if: matrix.k8s == '1.28'
        run: bash hack/test-envtest-setup.sh
      - name: Run tests (k8s ${{ matrix.k8s }})
        env:
          ENVTEST_K8S_VERSION: ${{ matrix.k8s }}.0
        run: make test

  docs-build:
    name: Docs Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install docs deps
        run: pip install -r docs-site/requirements.txt
      - name: Build docs site (strict)
        run: mkdocs build --strict -f docs-site/mkdocs.yml
      - name: Upload built site as artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-preview-${{ github.event.pull_request.number }}
          path: docs-site/site/
          retention-days: 7

  api-docs-sync:
    name: API Docs Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.4" }
      - name: Regenerate api-reference-generated.md
        run: make api-docs
      - name: Verify no drift
        run: |
          if ! git diff --exit-code docs/api-reference-generated.md; then
            echo "::error::docs/api-reference-generated.md is out of sync with the API types."
            echo "::error::Run 'make api-docs' locally and commit the result."
            exit 1
          fi
