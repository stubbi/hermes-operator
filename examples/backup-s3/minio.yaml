# In-cluster S3-compatible endpoint for trying out backups on kind.
#
# The upstream MinIO images are no longer publicly pullable, so this runs
# Versity S3 Gateway (posix backend) behind a Service still called "minio".
# Any S3-compatible server works; only the Service name and credentials matter.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels: { app: minio }
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: s3
          image: docker.io/versity/versitygw:v1.8.0
          args: ["--port", ":9000", "posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hermes-s3-creds, key: S3_ACCESS_KEY_ID } }
            - name: ROOT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: hermes-s3-creds, key: S3_SECRET_ACCESS_KEY } }
          ports:
            - containerPort: 9000
              name: api
          readinessProbe:
            tcpSocket: { port: 9000 }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app: minio }
  ports:
    - name: api
      port: 9000
      targetPort: 9000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-mkbucket
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mkbucket
          image: docker.io/amazon/aws-cli:2.35.6
          command:
            - sh
            - -c
            - |
              set -eu
              S3="aws --endpoint-url http://minio:9000 s3api"
              until $S3 list-buckets >/dev/null; do
                echo "waiting for the S3 endpoint..."; sleep 2
              done
              $S3 head-bucket --bucket hermes-backups 2>/dev/null || $S3 create-bucket --bucket hermes-backups
              echo "bucket ready"
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: hermes-s3-creds, key: S3_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hermes-s3-creds, key: S3_SECRET_ACCESS_KEY } }
