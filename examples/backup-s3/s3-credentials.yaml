apiVersion: v1
kind: Secret
metadata:
  name: hermes-s3-creds
type: Opaque
stringData:
  # Keys the operator reads (see docs/backup-restore.md).
  S3_ACCESS_KEY_ID: minio
  S3_SECRET_ACCESS_KEY: minio12345
  # Password of the restic repository. Change it, and keep it: snapshots
  # cannot be restored without it.
  RESTIC_PASSWORD: change-me-example-only
