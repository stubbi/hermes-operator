{{- if .Values.createRBAC }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hermes-operator.fullname" . }}
  labels: {{- include "hermes-operator.labels" . | nindent 4 }}
rules:
  {{- include "hermes-operator.clusterScopedRules" . | nindent 2 }}
  {{- if not .Values.watchNamespaces }}
  {{- include "hermes-operator.namespacedRules" . | nindent 2 }}
  {{- end }}
{{- end }}
